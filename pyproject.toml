[tool.poetry]
name = "polygon-generator"
version = "0.1.0"
description = "Natural language to geographic polygon generator using OpenAI and OpenStreetMap"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
# Streamlit and UI
streamlit = "^1.29.0"
streamlit-folium = "^0.15.1"
folium = "^0.15.1"

# LangChain and LLM
langchain = "^0.1.0"
langchain-openai = "^0.0.2"
langgraph = "^0.0.20"
openai = "^1.6.1"

# Geospatial
shapely = "^2.0.2"
geojson = "^3.1.0"
pyproj = "^3.6.1"

# HTTP and API
requests = "^2.31.0"
httpx = "^0.25.2"
aiohttp = "^3.9.0"

# Async support
nest-asyncio = "^1.5.8"

# Database
psycopg2-binary = "^2.9.9"

# Caching
redis = {version = "^5.0.1", optional = true}

# Utilities
python-dotenv = "^1.0.0"
pydantic = "^2.5.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
black = "^23.12.1"
ruff = "^0.1.9"
ipython = "^8.19.0"

[tool.poetry.extras]
redis = ["redis"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"
